# Nocturne safety configuration — SPEC section 5.2.
#
# This file governs the safety layer (SPEC section 9). Values here are
# ENFORCED, not advisory. The agent cannot read-modify-write this file and
# cannot alter these values at runtime; the loaded model is immutable.
#
# Do not set meridian.calibrated to true until you have completed the
# procedure in docs/meridian-calibration.md on your own mount and tripod.

limits:
  altitude_min_deg: 25           # below this, do not slew or track
  altitude_max_deg: 88           # zenith avoidance
  sun_avoidance_deg: 30          # angular distance from Sun, always
  sun_altitude_max_deg: -12      # no imaging above nautical twilight

  # MERIDIAN / TRIPOD COLLISION — see section 9.1. Calibrated, not guessed.
  meridian:
    calibrated: false            # implementation MUST refuse unattended mode while false
    calibration_date: null
    hour_angle_east_limit_deg: null   # measured by procedure in section 9.1
    hour_angle_west_limit_deg: null
    safety_margin_deg: 5

    # The two limits above bracket the region the tube may NOT enter, not the
    # region it may. A Newtonian points steeply near culmination and the mirror
    # cell end swings down towards a leg; culmination is the meridian. So the
    # margin WIDENS that band: measured -25 and +20 with a margin of 5 are
    # enforced as "nothing between -30 and +25" (ADR 0020).

    # Not a measurement of your tripod. How far the mount may travel before a
    # calibration stops applying: the polar axis is tilted to your latitude, so
    # the arc the tube sweeps past the legs changes with it. 0.5 deg is about
    # 55 km of travel and a tenth of the safety margin above.
    latitude_tolerance_deg: 0.5

    flip_strategy: "flip"        # "flip" | "stop"
    flip_settle_s: 30
    require_solve_after_flip: true

  # SYNCS AND NAMED TARGETS — see section 9.1 and ADR 0023. Both of these
  # bound something that can move the frame the limits above are measured in.
  targeting:
    # How far a plate-solve sync may move the mount's idea of where it is.
    # A sync further than this is a solve on the wrong field, and applying it
    # rotates the frame every limit in this file is expressed in.
    sync_tolerance_deg: 5

    # KStars resolves a target name against KStars' own clock, which is
    # simulated and can be stopped or moved. A position precessed to the wrong
    # instant looks entirely normal. 300 s is 1.25 deg of hour angle, a quarter
    # of the meridian safety margin above. It is not tighter than that because
    # KStars reports its clock as a Julian date to three decimals, which is a
    # resolution of 86.4 s: a smaller limit would refuse a synchronised pair on
    # rounding alone.
    resolver_max_clock_skew_s: 300

  cooling:
    max_delta_from_ambient_c: 35
    abort_if_power_draw_exceeds_percent: 95

abort_conditions:
  guiding_lost_s: 180
  plate_solve_failures_consecutive: 3
  cloud_star_count_drop_percent: 60
  cloud_confirm_frames: 2
  mount_communication_loss_s: 30
  disk_free_min_gb: 20

on_abort:
  action: "park"                 # stop tracking, park, warm TEC on ramp, close session
  notify: true
  notify_severity: "alarm"

agent:
  max_tokens_per_session: 400000
  max_calls_per_hour: 60
  on_budget_exhausted: "autonomous"   # continue on deterministic rules, no agent
  on_api_unreachable: "autonomous"
