# Nocturne equipment configuration — SPEC section 5.1.
#
# Reference hardware. Nothing here is hardcoded anywhere in the code: the
# operator's migration from guide scope to OAG, and the addition of a coma
# corrector, are changes to this file only.

# =============================================================================
# REPLACE THIS BEFORE THE FIRST SESSION.
#
# These coordinates are a placeholder, not a site. Nocturne warns at every
# startup while they are still here, because nothing about wrong coordinates
# fails loudly: the ephemeris, the altitude windows and the meridian timing are
# all derived from them, so a placeholder simply points the telescope at the
# wrong part of the sky, at the wrong times, all night.
#
# Get yours to four decimal places from a map, standing where the mount stands.
# The repository ships nobody's real address on purpose — yours is your own.
# =============================================================================
site:
  name: "PLACEHOLDER — replace with your site"
  latitude: 45.0                 # degrees north, negative for south
  longitude: 0.0                 # degrees east, negative for west
  elevation_m: 100
  timezone: "UTC"                # IANA name, e.g. "Europe/Madrid"

optical_trains:
  - id: "native"
    active: true
    focal_length_mm: 1000        # nominal; overridden by plate solve
    aperture_mm: 200
    corrector: null
  - id: "mpcc"
    active: false
    focal_length_mm: 1000
    aperture_mm: 200
    corrector: "Baader MPCC Mark III"
    backfocus_mm: 55

imaging_camera:
  indi_driver: "indi_asi_ccd"
  indi_device_name: "ZWO CCD ASI533MM Pro"
  name: "ZWO CCD ASI533MM Pro"
  pixel_size_um: 3.76
  width_px: 3008
  height_px: 3008
  bit_depth: 14
  mono: true
  cooled: true
  cooling:
    target_c: -10
    ramp_c_per_min: 2.0          # never exceed; TEC longevity
    settle_tolerance_c: 0.5
    settle_timeout_s: 600
  # Applied to the driver on every connect and after every reconnection. The
  # 533MM ships at Gain=200 Offset=1 — a driver default, not our configuration
  # (docs/FIELD-NOTES-M1.md §11). The gain comes from the active gain profile.
  offset: 1
  gain_profiles:
    # PLACEHOLDERS. SPEC §15 requires these to be measured, not taken from the
    # datasheet: the exposure solver divides by them. Measure with the procedure
    # in docs/sensor-characterisation.md before trusting any computed exposure.
    - name: "hcg"
      gain: 100
      read_noise_e: 1.5
      full_well_e: 21000
      e_per_adu: 0.32

filter_wheel:
  indi_driver: "indi_asi_wheel"
  indi_device_name: "ZWO EFW"
  # Slot order verified physically on 2026-08-07 by opening the wheel and reading
  # the filter markings — docs/FIELD-NOTES-M1.md §10.1. Every slot in the earlier
  # version was wrong; it was a different mapping, not an off-by-one.
  #
  # Nocturne WRITES these names into the driver on every connect and never reads
  # the driver's own back (§10.2). The wheel shipped holding ZWO factory names —
  # Red, Green, Blue, H_Alpha, SII, OIII, LPR, Luminance — which match nothing in
  # it. Trusting those would file B frames as H-Alpha, and no image would look
  # wrong.
  #
  # THIS IS THE SOURCE OF TRUTH FOR WHAT IS IN THE WHEEL. If you physically move
  # a filter, change it here; nothing else knows.
  slots:
    1: { name: "L",     type: "luminance",  offset_steps: 0 }
    2: { name: "R",     type: "red",        offset_steps: 0 }
    3: { name: "G",     type: "green",      offset_steps: 0 }
    4: { name: "B",     type: "blue",       offset_steps: 0 }
    5: { name: "Dark",  type: "dark",       offset_steps: 0 }
    6: { name: null,    type: "empty" }
    7: { name: null,    type: "empty" }
    8: { name: null,    type: "empty" }

focuser:
  indi_driver: "indi_asi_focuser"
  indi_device_name: "ZWO EAF"
  # The EAF ships with FOCUS_BACKLASH_STEPS=180 and the toggle disabled. 180 is a
  # ZWO default, NOT a measurement — and neither was the 0 that used to be here,
  # which was worse because it looked like one. Left unset until measured; the M2
  # procedure must distinguish the default it will find from the value it takes.
  backlash_steps: null           # measure in M2; see docs/FIELD-NOTES-M1.md §12
  step_size_um: null             # measured
  # Omitted on purpose. The driver reports FOCUS_MAX.FOCUS_MAX_VALUE=100000, which
  # comes from the hardware and is authoritative; the 60000 that used to be here
  # was invented. Set this only to impose a travel limit TIGHTER than the
  # driver's — bring-up refuses a value above it rather than silently clamping.
  max_position: null
  temperature_compensation:
    enabled: false               # enable only after coefficient measured
    coefficient_steps_per_c: null
  refocus_triggers:
    delta_temperature_c: 1.5
    hfd_drift_percent: 15
    elapsed_minutes: 60
    on_filter_change: true

guiding:
  # These values change entirely when migrating to OAG. Never hardcode.
  mode: "guidescope"             # "guidescope" | "oag"
  camera:
    indi_driver: "indi_asi_ccd"
    indi_device_name: "ZWO CCD ASI120MM Mini"
    name: "ZWO CCD ASI120MM Mini"
    pixel_size_um: 3.75
    width_px: 1280
    height_px: 960
    # Applied to the driver on connect and after every reconnection. The driver
    # ships at exactly these values, but that is coincidence, not agreement.
    gain: 50
    offset: 0
  focal_length_mm: 120
  exposure_s: 2.0
  calibration_step_ms: 1500
  dither:
    enabled: true
    pixels: 3.0
    settle_tolerance_px: 1.5
    settle_timeout_s: 120
    every_n_frames: 1
  thresholds:
    rms_warn_arcsec: 1.2
    rms_abort_arcsec: 2.5
    max_consecutive_lost_frames: 5

mount:
  indi_driver: "indi_eqmod_telescope"
  # The name the driver announces itself under. This is the driver's name for
  # the device, not yours: indi_eqmod says "EQMod Mount" whatever mount is on
  # the tripod. Nocturne addresses the device by this string, so it must match
  # exactly. Read it off a running driver with:
  #   indi_getprop | cut -d. -f1 | sort -u
  indi_device_name: "EQMod Mount"
  device_label: "Wave 150i"      # yours, for display; translatable
  connection: "serial"           # USB serial preferred over WiFi
  # Left unset on purpose. indi_eqmod finds the mount and fills DEVICE_PORT
  # itself, correctly, with the stable by-id path (docs/FIELD-NOTES-M1.md §2.3),
  # and a by-id path contains the mount's own serial number — one that is right
  # for one rig is a dead path on every other.
  #
  # Set it only to override the driver's choice, for instance if two mounts are
  # attached. `ls -l /dev/serial/by-id/` gives yours; it looks like
  #   /dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_<serial>-if00
  # Use the by-id path and not /dev/ttyACM0: ttyACM0 is handed out in plug
  # order and moves when another USB serial device appears. The Wave 150i is an
  # STM32 virtual COM port (CDC-ACM), so it is ttyACM and never ttyUSB — there
  # is no FTDI/CH340/CP210x bridge chip in it.
  #
  # If you set this and the device is not present, Nocturne refuses to start
  # rather than falling back to auto-detection, which would hide a cable moved
  # to the wrong socket.
  port: null
  # The driver starts at 9600 and must be told this before CONNECT.
  baud: 115200
  slew_rate_max_deg_s: 3.0       # deliberately below the mount's 7.5; portable setup
  counterweight_fitted: false
