name: CI

# SPEC section 13.3. The frontend build, eslint and the i18n completeness check
# join this workflow with M4; there is no frontend to check yet.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: ruff and mypy --strict
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy --strict
        run: mypy

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S style scripts/install.sh

  test:
    name: pytest against the INDI simulators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # SPEC section 13.1: the whole suite runs against the INDI simulator
      # drivers, so CI needs them. The indilib PPA carries INDI 2.x; Ubuntu's
      # own indi-bin is older but ships the same simulator drivers, and is the
      # fallback if the PPA is unreachable.
      - name: Install INDI and DBus
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dbus
          if sudo add-apt-repository -y ppa:mutlaqja/ppa 2>/dev/null; then
            sudo apt-get update -qq
          else
            echo "::warning::indilib PPA unavailable, falling back to the Ubuntu archive"
          fi
          sudo apt-get install -y --no-install-recommends indi-bin
          indiserver --help 2>&1 | head -n 5 || true

      # A silent skip would turn the M1 AUTO criteria into a green tick that
      # proves nothing.
      - name: Refuse to run without the simulators
        run: |
          python - <<'PY'
          import shutil, sys
          required = [
              "indiserver",
              "indi_simulator_telescope",
              "indi_simulator_ccd",
              "indi_simulator_guide",
              "indi_simulator_focus",
              "indi_simulator_wheel",
              "dbus-daemon",
          ]
          missing = [name for name in required if shutil.which(name) is None]
          if missing:
              sys.exit("missing, so the integration tests would silently skip: " + ", ".join(missing))
          print("all simulator drivers present")
          PY

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest backend/tests/unit -q

      - name: Integration tests against the simulators
        run: pytest backend/tests/integration -q

      - name: M1 AUTO acceptance summary
        if: always()
        run: |
          echo "### M1 AUTO criteria (SPEC section 14)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Connects to all five simulator drivers, reads and writes properties," >> "$GITHUB_STEP_SUMMARY"
          echo "survives driver restart, reconnects automatically." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified by \`backend/tests/integration/test_indi_simulators.py\`." >> "$GITHUB_STEP_SUMMARY"

  installer:
    name: installer self-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and option parsing
        run: |
          bash -n scripts/install.sh
          ./scripts/install.sh --help > /dev/null
          # An unknown option must fail rather than proceed to build anything.
          if ./scripts/install.sh --definitely-not-an-option 2>/dev/null; then
            echo "install.sh accepted an unknown option"
            exit 1
          fi
